<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chef Station — DineFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    /* ── Design Tokens ── */
    :root {
      --coffee:    #6F4E37;
      --cream:     #F8F5F0;
      --mint:      #3AAFA9;
      --success:   #2A9D8F;
      --error:     #E63946;
      --dark-bg:   #1E1E1E;
      --white:     #FFFFFF;
      --border:    #EDE7DD;
      --muted:     #999;

      --cat-starter:   #F59E0B;
      --cat-main:      #E63946;
      --cat-breads:    #F4A261;
      --cat-sides:     #8B5CF6;
      --cat-desserts:  #EC4899;
      --cat-beverages: #3B82F6;
      --cat-custom:    #10B981;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: #1A1A1A;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: var(--cream);
      color: var(--dark-bg);
      padding: 0.7rem 1rem;
      flex-shrink: 0;
      border-bottom: 2px solid var(--coffee);
    }
    .header-content { display:flex; justify-content:space-between; align-items:center; }

    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--coffee);
    }
    .header h1 i { color: var(--mint); }
    .header .time { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .queue-pill {
      background: var(--mint);
      border-radius: 2rem;
      padding: 0.15rem 0.75rem;
      text-align: center;
      min-width: 48px;
    }
    .q-label { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); text-transform: uppercase; }
    .q-count { font-family:'Poppins',sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--white); line-height: 1.1; }

    /* ── Container ── */
    .container {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0.6rem;
      background: var(--cream);
    }

    .queue-title {
      font-family: 'Poppins', sans-serif;
      font-size: 12px; font-weight: 600;
      color: var(--coffee);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.35rem;
      flex-shrink: 0;
    }

    /* ── Table wrapper ── */
    .table-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--white);
      border-radius: 0.75rem;
      box-shadow: 0 2px 16px rgba(111,78,55,0.12);
      border: 1.5px solid var(--border);
    }

    .orders-table {
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .orders-table table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    /* thead */
    .orders-table thead {
      background: linear-gradient(135deg, #6F4E37 0%, #4A3020 100%);
    }
    .orders-table thead th {
      padding: 0.55rem 0.4rem;
      text-align: left;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
    }
    /* colour strip col */
    .orders-table thead th:first-child {
      width: 5px; padding: 0;
      border-radius: 0.75rem 0 0 0;
    }
    /* Table col */
    .orders-table thead th:nth-child(2) {
      width: 48px; text-align: center;
    }
    /* Dish col — auto */
    /* Qty col */
    .orders-table thead th:nth-child(4) {
      width: 38px; text-align: center;
    }
    /* Actions col */
    .orders-table thead th:last-child {
      width: 130px; text-align: center;
      border-radius: 0 0.75rem 0 0;
    }

    /* tbody scroll */
    .orders-table tbody {
      display: block;
      overflow-y: auto;
      max-height: calc(100vh - 160px);
    }
    .orders-table thead,
    .orders-table tbody tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    /* rows */
    .orders-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .orders-table tbody tr:nth-child(even) { background: #FBF8F4; }
    .orders-table tbody tr:last-child { border-bottom: none; }
    .orders-table tbody tr:active { background: #F3EDE5; }

    .orders-table tbody td {
      padding: 0.5rem 0.4rem;
      vertical-align: middle;
      font-size: 0.75rem;
    }
    /* mirror widths */
    .orders-table tbody td:nth-child(1) { width: 5px; padding: 0; }
    .orders-table tbody td:nth-child(2) { width: 48px; }
    .orders-table tbody td:nth-child(4) { width: 38px; }
    .orders-table tbody td:nth-child(5) { width: 130px; }

    /* ── Category colour strip ── */
    .cat-strip { width: 5px; height: 100%; min-height: 42px; }
    .cat-starter   { background: var(--cat-starter); }
    .cat-main      { background: var(--cat-main); }
    .cat-breads    { background: var(--cat-breads); }
    .cat-sides     { background: var(--cat-sides); }
    .cat-desserts  { background: var(--cat-desserts); }
    .cat-beverages { background: var(--cat-beverages); }
    .cat-custom    { background: var(--cat-custom); }

    /* ── Table number cell ── */
    .table-cell { text-align: center; }
    .t-num {
      font-family: 'Poppins', sans-serif;
      font-size: 16px; font-weight: 700;
      color: var(--coffee);
      line-height: 1;
    }

    /* ── Dish cell ── */
    .dish-name {
      font-family: 'Inter', sans-serif;
      font-size: 12px; font-weight: 600;
      color: #1A1A1A; line-height: 1.25;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .dish-sub {
      font-size: 10px; color: var(--muted);
      margin-top: 2px;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .custom-badge {
      background: #D1FAE5; color: #065F46;
      font-size: 8px; font-weight: 700;
      padding: 1px 4px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }

    /* ── Qty cell ── */
    .qty-cell { text-align: center; }
    .qty-bubble {
      background: var(--coffee); color: var(--white);
      width: 26px; height: 26px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-size: 12px; font-weight: 700;
    }

    /* ── Actions cell ── */
    .actions-cell { text-align: center; }
    .actions { display: flex; flex-direction: column; gap: 4px; }

    .btn {
      border: none; border-radius: 0.375rem;
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 3px;
      padding: 0.3rem 0.4rem;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn i { font-size: 10px; }

    .btn-done {
      background: var(--mint); color: var(--white);
      box-shadow: 0 1px 4px rgba(58,175,169,0.3);
    }
    .btn-done:active { background: var(--success); transform: scale(0.96); }

    .btn-recipe {
      background: var(--cream); color: var(--coffee);
      border: 1.5px solid var(--coffee);
    }
    .btn-recipe:active { background: var(--coffee); color: var(--white); }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 3rem 1.5rem; }
    .empty-state .e-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty-state h3 { font-family:'Poppins',sans-serif; font-size:15px; font-weight:600; color:#666; margin-bottom:0.25rem; }
    .empty-state p { font-size:12px; color:#999; }

    /* ── Toast notification ── */
    .toast {
      position: fixed;
      bottom: 1rem; left: 0.75rem; right: 0.75rem;
      background: var(--dark-bg); color: var(--white);
      border-radius: 0.75rem;
      padding: 0.8rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      border-left: 4px solid var(--mint);
      z-index: 1000;
      opacity: 0; transform: translateY(100px);
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast.hide { opacity: 0; transform: translateY(100px); transition: opacity 0.25s ease, transform 0.25s ease; }
    .toast-icon { font-size: 1.25rem; color: var(--mint); flex-shrink: 0; }
    .toast-title { font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; margin-bottom:1px; }
    .toast-msg { font-size:11px; color:rgba(255,255,255,0.6); }

    /* ── Recipe modal (bottom sheet) ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 999;
      display: none; align-items: flex-end;
      backdrop-filter: blur(3px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--white);
      border-radius: 1rem 1rem 0 0;
      width: 100%; max-height: 80vh;
      overflow-y: auto;
      animation: sheetUp 0.3s cubic-bezier(0.34,1.4,0.64,1);
    }
    @keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

    .modal-handle { width:36px; height:4px; background:#DDD; border-radius:2px; margin:0.75rem auto 0; }

    .modal-header {
      padding: 0.75rem 1rem 0.875rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start;
      background: var(--cream);
      border-radius: 1rem 1rem 0 0;
    }
    .modal-header h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 16px; font-weight: 700; color: var(--coffee);
      margin-bottom: 2px;
    }
    .modal-sub { font-size: 11px; color: var(--muted); }

    .close-btn {
      background: var(--white); border: 1.5px solid var(--border);
      width: 2rem; height: 2rem; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #666; flex-shrink: 0;
      transition: all 0.15s;
    }
    .close-btn:active { background: var(--coffee); color: var(--white); border-color: var(--coffee); }

    .modal-body { padding: 1rem; }
    .m-title {
      font-family: 'Poppins', sans-serif;
      font-size: 11px; font-weight: 600;
      color: var(--coffee); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.3rem;
    }

    .ing-list { background: var(--cream); border-radius: 0.625rem; padding: 0.6rem 0.75rem; margin-bottom: 1.1rem; }
    .ing-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.4rem 0; border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .ing-item:first-child { padding-top: 0; }
    .ing-item:last-child { border-bottom: none; padding-bottom: 0; }
    .ing-dot { width: 5px; height: 5px; background: var(--coffee); border-radius: 50%; flex-shrink: 0; }
    .ing-name { flex: 1; font-weight: 500; }
    .ing-amt { font-size: 12px; color: var(--muted); font-weight: 600; }

    .steps-list { display: flex; flex-direction: column; gap: 0.65rem; }
    .step { display: flex; gap: 0.6rem; align-items: flex-start; }
    .step-num {
      width: 20px; height: 20px; background: var(--coffee); color: var(--white);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
    }
    .step-text { flex: 1; font-size: 12px; line-height: 1.5; color: #333; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>

<body>
<div id="app">

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div>
        <h1><i class="bi bi-fire"></i> Chef Station</h1>
        <div class="time" v-text="currentTime"></div>
      </div>
      <div class="queue-pill">
        <div class="q-label">Queue</div>
        <div class="q-count" v-text="orders.length"></div>
      </div>
    </div>
  </header>

  <!-- Orders -->
  <div class="container">
    <div class="queue-title">
      <i class="bi bi-list-check"></i> Order Queue
    </div>

    <!-- Empty -->
    <div v-if="orders.length === 0" class="empty-state">
      <div class="e-icon">🎉</div>
      <h3>All Clear!</h3>
      <p>No pending orders in the queue.</p>
    </div>

    <!-- Table -->
    <div v-else class="table-container">
      <div class="orders-table">
        <table>
          <thead>
            <tr>
              <th></th>
              <th style="text-align:center">Table</th>
              <th>Dish</th>
              <th style="text-align:center">Qty</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="order in orders" :key="order.id">

              <!-- Category strip -->
              <td style="padding:0">
                <div class="cat-strip" :class="'cat-' + getCatClass(order.category)"></div>
              </td>

              <!-- Table number -->
              <td class="table-cell">
                <div class="t-num" v-text="order.table"></div>
              </td>

              <!-- Dish -->
              <td>
                <div class="dish-name" v-text="order.name"></div>
                <div class="dish-sub">
                  <span v-text="order.category"></span>
                  <span v-if="order.isCustom" class="custom-badge">Custom</span>
                </div>
              </td>

              <!-- Qty -->
              <td class="qty-cell">
                <div class="qty-bubble" v-text="order.qty"></div>
              </td>

              <!-- Actions -->
              <td class="actions-cell">
                <div class="actions">
                  <button v-if="order.isCustom" class="btn btn-recipe" @click="viewRecipe(order)">
                    <i class="bi bi-book-fill"></i> Recipe
                  </button>
                  <button class="btn btn-done" @click="markDone(order)">
                    <i class="bi bi-check-circle-fill"></i> Done
                  </button>
                </div>
              </td>

            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" :class="{ show: toast.show, hide: toast.hiding }">
    <div class="toast-icon"><i class="bi bi-bell-fill"></i></div>
    <div>
      <div class="toast-title">Order ready to dispatch!</div>
      <div class="toast-msg" v-text="toast.message"></div>
    </div>
  </div>

  <!-- Recipe Modal -->
  <div class="modal-overlay" :class="{ active: modal.open }" @click.self="closeModal">
    <div class="modal" v-if="modal.dish">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div>
          <h2 v-text="modal.dish.name"></h2>
          <div class="modal-sub">Qty: {{ modal.dish.qty }} &nbsp;·&nbsp; Table {{ modal.dish.table }}</div>
        </div>
        <button class="close-btn" @click="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="m-title"><i class="bi bi-basket3-fill"></i> Ingredients</div>
        <div class="ing-list">
          <div v-for="ing in modal.dish.ingredients" :key="ing.name" class="ing-item">
            <div class="ing-dot"></div>
            <div class="ing-name" v-text="ing.name"></div>
            <div class="ing-amt" v-text="ing.amount"></div>
          </div>
        </div>
        <div class="m-title"><i class="bi bi-list-ol"></i> Steps</div>
        <div class="steps-list">
          <div v-for="(step, i) in modal.dish.steps" :key="i" class="step">
            <div class="step-num" v-text="i + 1"></div>
            <div class="step-text" v-text="step"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      currentTime: '',
      toast: { show: false, hiding: false, message: '' },
      modal: { open: false, dish: null },
      orders: [
        { id:1,  name:'Butter Chicken',      category:'Main Course', table:7,  qty:2, isCustom:false },
        { id:2,  name:'Paneer Tikka',        category:'Starter',     table:3,  qty:1, isCustom:false },
        { id:3,  name:'Garlic Naan',         category:'Breads',      table:7,  qty:4, isCustom:false },
        { id:4,  name:'Special Fusion Curry',category:'Custom',      table:5,  qty:1, isCustom:true,
          ingredients:[
            {name:'Coconut milk',    amount:'400ml'},
            {name:'Red curry paste', amount:'3 tbsp'},
            {name:'Mixed vegetables',amount:'2 cups'},
            {name:'Tofu cubes',      amount:'200g'},
            {name:'Thai basil',      amount:'½ cup'},
            {name:'Lime juice',      amount:'2 tbsp'}
          ],
          steps:[
            'Heat oil in a wok, add red curry paste and fry 1 min until fragrant.',
            'Pour coconut milk and bring to a gentle simmer.',
            'Add vegetables and tofu, cook 8-10 min until tender.',
            'Season with lime juice and palm sugar to taste.',
            'Garnish with Thai basil. Serve with jasmine rice.'
          ]
        },
        { id:5,  name:'Mango Lassi',         category:'Beverages',   table:3,  qty:2, isCustom:false },
        { id:6,  name:'Dal Makhani',          category:'Main Course', table:11, qty:1, isCustom:false },
        { id:7,  name:'Chef Special Delight', category:'Custom',      table:11, qty:1, isCustom:true,
          ingredients:[
            {name:'Chicken breast',amount:'300g'},
            {name:'Heavy cream',   amount:'200ml'},
            {name:'White wine',    amount:'100ml'},
            {name:'Mushrooms',     amount:'150g'},
            {name:'Fresh herbs',   amount:'¼ cup'},
            {name:'Butter',        amount:'50g'}
          ],
          steps:[
            'Season chicken, sear until golden on both sides.',
            'Remove chicken; sauté mushrooms with butter in same pan.',
            'Deglaze with white wine, reduce by half.',
            'Add cream and herbs, simmer 5 min until thickened.',
            'Return chicken, coat with sauce. Serve immediately.'
          ]
        },
        { id:8,  name:'Gulab Jamun',         category:'Desserts',    table:2,  qty:4, isCustom:false },
        { id:9,  name:'Raita',               category:'Sides',       table:5,  qty:1, isCustom:false }
      ]
    };
  },

  methods: {
    updateTime() {
      const n = new Date();
      this.currentTime =
        n.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true }) +
        ' • ' + n.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
    },

    getCatClass(cat) {
      return ({
        'Starter':'starter', 'Main Course':'main', 'Breads':'breads',
        'Sides':'sides', 'Desserts':'desserts', 'Beverages':'beverages', 'Custom':'custom'
      })[cat] || 'main';
    },

    markDone(order) {
      this.toast.message = `${order.name} · Table ${order.table} — Waiter notified`;
      this.toast.show = true; this.toast.hiding = false;

      setTimeout(() => {
        const i = this.orders.findIndex(o => o.id === order.id);
        if (i > -1) this.orders.splice(i, 1);
      }, 350);

      setTimeout(() => {
        this.toast.hiding = true;
        setTimeout(() => { this.toast.show = false; this.toast.hiding = false; }, 280);
      }, 3200);
    },

    viewRecipe(order) { this.modal.dish = order; this.modal.open = true; },
    closeModal() { this.modal.open = false; }
  },

  mounted() { this.updateTime(); setInterval(this.updateTime, 30000); }
}).mount('#app');
</script>
</body>
</html>
