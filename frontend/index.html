<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DineFlow</title>

  <!-- Vue 3 (global) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #F8F5F0 0%, #EDE8E0 100%);
      color: #1A1208;
      min-height: 100vh;
    }

    .btn-ghost {
      background: transparent;
      border: 1.5px solid #E5DDD5;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-ghost:hover { background: #F8F5F0; border-color: #D9CFC6; }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex items-center justify-center p-4">
    <div v-if="view === 'home'" class="w-full" style="max-width:980px;">
      <div class="text-center mb-8">
        <div style="width:72px;height:72px;background:linear-gradient(135deg,#6F4E37,#8B6347);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;color:white;">
          <i class="bi bi-cup-hot" style="font-size:2rem;"></i>
        </div>
        <h1 style="font-family:'Playfair Display',serif;font-weight:800;font-size:2.25rem;margin:0;">DineFlow</h1>
        <p style="color:#6B5744;font-weight:600;margin-top:0.5rem;">Choose your portal</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <button @click="view='manager_login'" class="bg-white border rounded-2xl p-5 text-left hover:shadow-lg transition"
                style="border-color:rgba(111,78,55,0.15);box-shadow:0 2px 12px rgba(111,78,55,0.06);">
          <div class="flex items-center gap-3 mb-3">
            <div style="width:44px;height:44px;border-radius:12px;background:#FDF4ED;color:#6F4E37;display:flex;align-items:center;justify-content:center;">
              <i class="bi bi-briefcase" style="font-size:1.1rem;"></i>
            </div>
            <div style="font-weight:900;">Manager</div>
          </div>
          <div style="color:#6B5744;font-weight:600;font-size:0.9rem;">Inventory, menu, orders, analytics</div>
        </button>

        <a href="customer.html" class="bg-white border rounded-2xl p-5 text-left hover:shadow-lg transition block"
           style="border-color:rgba(111,78,55,0.15);box-shadow:0 2px 12px rgba(111,78,55,0.06);text-decoration:none;color:inherit;">
          <div class="flex items-center gap-3 mb-3">
            <div style="width:44px;height:44px;border-radius:12px;background:#EDF7F6;color:#2A9D8F;display:flex;align-items:center;justify-content:center;">
              <i class="bi bi-person" style="font-size:1.1rem;"></i>
            </div>
            <div style="font-weight:900;">Customer</div>
          </div>
          <div style="color:#6B5744;font-weight:600;font-size:0.9rem;">Browse menu and place orders</div>
        </a>

        <a href="waiter.html" class="bg-white border rounded-2xl p-5 text-left hover:shadow-lg transition block"
           style="border-color:rgba(111,78,55,0.15);box-shadow:0 2px 12px rgba(111,78,55,0.06);text-decoration:none;color:inherit;">
          <div class="flex items-center gap-3 mb-3">
            <div style="width:44px;height:44px;border-radius:12px;background:#F0EBE3;color:#6F4E37;display:flex;align-items:center;justify-content:center;">
              <i class="bi bi-receipt" style="font-size:1.1rem;"></i>
            </div>
            <div style="font-weight:900;">Waiter</div>
          </div>
          <div style="color:#6B5744;font-weight:600;font-size:0.9rem;">Tables and service workflow</div>
        </a>

        <a href="chef-dashboard-mobile.html" class="bg-white border rounded-2xl p-5 text-left hover:shadow-lg transition block"
           style="border-color:rgba(111,78,55,0.15);box-shadow:0 2px 12px rgba(111,78,55,0.06);text-decoration:none;color:inherit;">
          <div class="flex items-center gap-3 mb-3">
            <div style="width:44px;height:44px;border-radius:12px;background:#FFFBF0;color:#92400E;display:flex;align-items:center;justify-content:center;">
              <i class="bi bi-fire" style="font-size:1.1rem;"></i>
            </div>
            <div style="font-weight:900;">Chef</div>
          </div>
          <div style="color:#6B5744;font-weight:600;font-size:0.9rem;">Kitchen order queue</div>
        </a>
      </div>
    </div>

    <div v-else class="w-full">
      <div style="position:fixed;top:16px;left:16px;z-index:10;">
        <button class="btn-ghost" @click="view='home'">
          <i class="bi bi-arrow-left" style="margin-right:0.5rem;"></i>Back
        </button>
      </div>

      <manager-login-component v-if="view === 'manager_login'" @login-success="onManagerLoginSuccess" />
    </div>
  </div>

  <script type="module">
    import ManagerLoginComponent from './components/ManagerLogin.js';

    const { createApp, ref } = Vue;

    createApp({
      components: { ManagerLoginComponent },
      setup() {
        const view = ref('home'); // home | manager_login

        const onManagerLoginSuccess = () => {
          window.location.href = 'manager-dashboard.html';
        };

        return { view, onManagerLoginSuccess };
      }
    }).mount('#app');
  </script>
</body>
</html>
