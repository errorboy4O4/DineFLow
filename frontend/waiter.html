<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>DineFlow - Waiter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #F8F5F0;
      color: #1A1208;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F8F5F0;
      position: relative;
      box-shadow: 0 0 60px rgba(111,78,55,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .w-header {
      background: #1A1208;
      padding: 1rem 1.25rem 0.875rem;
      display: flex; align-items: center; gap: 0.875rem;
      flex-shrink: 0;
    }
    .w-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #6F4E37, #3AAFA9);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0; font-weight: 700;
      color: white;
    }
    .w-name { font-size: 0.9375rem; font-weight: 700; color: #F8F5F0; }
    .w-role { font-size: 0.7rem; color: rgba(248,245,240,0.5); font-weight: 600; }
    .w-shift {
      margin-left: auto;
      font-size: 0.75rem; font-weight: 700; color: #F4A261;
      background: rgba(244,162,97,0.12); border: 1px solid rgba(244,162,97,0.2);
      padding: 0.25rem 0.625rem; border-radius: 20px;
      white-space: nowrap;
    }
    .w-notif {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      color: rgba(248,245,240,0.7); font-size: 1.1rem; cursor: pointer;
      position: relative;
    }
    .w-notif-dot {
      position: absolute; top: 6px; right: 6px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #E63946; border: 1.5px solid #1A1208;
    }

    /* Alert banner */
    .alert-banner {
      background: linear-gradient(90deg, #4A3423, #6F4E37);
      padding: 0.625rem 1.25rem;
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8125rem; font-weight: 700; color: white;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Tabs */
    .w-tabs {
      background: white;
      border-bottom: 1px solid rgba(111,78,55,0.1);
      display: flex; flex-shrink: 0;
    }
    .w-tab {
      flex: 1; padding: 0.75rem 0.25rem;
      text-align: center; font-size: 0.7rem; font-weight: 700;
      color: #9C8E84; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s; position: relative;
    }
    .w-tab i { font-size: 1.1rem; display: block; margin-bottom: 0.2rem; }
    .w-tab.active { color: #6F4E37; border-bottom-color: #6F4E37; }
    .w-tab-badge {
      position: absolute; top: 8px; right: calc(50% - 18px);
      background: #E63946; color: white;
      font-size: 0.55rem; font-weight: 700;
      padding: 0.1rem 0.3rem; border-radius: 2rem;
      border: 1.5px solid white; min-width: 16px; text-align: center;
    }

    /* Content */
    .w-content { flex: 1; overflow-y: auto; padding-bottom: 1rem; }
    .w-section { padding: 1rem 1rem 0; }
    .w-section-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #9C8E84; margin-bottom: 0.75rem;
    }

    .panel {
      background: white;
      border-radius: 1rem;
      border: 1px solid rgba(111,78,55,0.1);
      box-shadow: 0 2px 12px rgba(111,78,55,0.06);
      overflow: hidden;
    }

    /* Tables */
    .legend { display:flex; align-items:center; gap: 0.75rem; font-size: 0.75rem; color:#6B5744; font-weight: 800; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .legend-item { display:flex; align-items:center; gap: 0.35rem; }
    .dot { width: 8px; height: 8px; border-radius: 999px; }

    /* Tables grid: keep boxes readable on small phones */
    .table-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px; width:100%; max-width:100%; }
    @media (min-width: 390px) {
      .table-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .t-card {
      border: 1.5px solid rgba(111,78,55,0.16);
      background: #FFFFFF;
      border-radius: 0.9rem;
      padding: 0.65rem 0.6rem;
      width: 100%;
      text-align:center;
      min-height: 86px;
      min-width: 0;
      cursor:pointer;
      box-shadow: 0 2px 10px rgba(111,78,55,0.05);
      transition: transform 0.12s;
    }
    .t-card:active { transform: scale(0.98); }
    /* Status colors: make Free vs Occupied clearly different */
    .t-card.free {
      background: #FFFFFF;
      border-color: rgba(176,164,156,0.85);
    }
    .t-card.occupied {
      background: rgba(111,78,55,0.14);
      border-color: rgba(111,78,55,0.55);
    }
    .t-card.ready {
      background: rgba(58,175,169,0.14);
      border-color: rgba(58,175,169,0.55);
    }
    .t-card.waiting {
      background: rgba(230,57,70,0.12);
      border-color: rgba(230,57,70,0.55);
    }

    /* Stack number + status so labels never get clipped on small cards */
    .t-top { display:flex; flex-direction:column; align-items:center; gap: 0.35rem; min-width:0; width:100%; }
    .t-num { font-family:'Playfair Display',serif; font-weight: 900; font-size: 1.15rem; color:#1A1208; line-height: 1.05; }
    .t-badge {
      font-size: 0.72rem;
      font-weight: 900;
      display:flex;
      align-items:center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(111,78,55,0.14);
      background: #FAFAF7;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .t-badge.free { color: #6B5744; border-color: rgba(176,164,156,0.35); background: rgba(176,164,156,0.10); }
    .t-badge.occupied { color: #6F4E37; border-color: rgba(111,78,55,0.30); background: rgba(111,78,55,0.10); }
    .t-badge.ready { color: #2A9D8F; border-color: rgba(58,175,169,0.38); background: rgba(58,175,169,0.10); }
    .t-badge.waiting { color: #E63946; border-color: rgba(230,57,70,0.34); background: rgba(230,57,70,0.09); }
    .t-badge-dot { width: 7px; height: 7px; border-radius: 999px; background: #E63946; box-shadow: 0 0 0 2px rgba(230,57,70,0.16); }

    .stats-row { display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.85rem; }
    .stat-card { background:white; border-radius: 1rem; border: 1px solid rgba(111,78,55,0.1); box-shadow: 0 2px 12px rgba(111,78,55,0.06); padding: 0.9rem 1rem; }
    .stat-num { font-family:'Playfair Display',serif; font-weight: 900; font-size: 1.4rem; color:#1A1208; }
    .stat-label { color:#9C8E84; font-weight: 900; font-size: 0.78rem; margin-top: 0.2rem; }

    /* Orders */
    .ready-table { padding: 0.75rem; }
    .ready-head { display:grid; grid-template-columns: 52px 1fr 44px 90px; gap: 0.5rem; font-size: 0.65rem; font-weight: 900; color:#9C8E84; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.4rem 0.2rem 0.6rem; border-bottom: 1px solid rgba(111,78,55,0.08); }
    .ready-row { display:grid; grid-template-columns: 52px 1fr 44px 90px; gap: 0.5rem; align-items:center; padding: 0.65rem 0.2rem; border-bottom: 1px solid rgba(111,78,55,0.06); }
    .ready-row:last-child { border-bottom: none; }
    .table-pill { width: 36px; height: 36px; border-radius: 10px; background: rgba(58,175,169,0.12); border: 1px solid rgba(58,175,169,0.25); color:#2A8F8A; font-weight: 900; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .dish-name { font-weight: 900; color:#1A1208; font-size: 0.9rem; white-space:nowrap; overflow:hidden; text-overflow: ellipsis; }
    .qty-pill { width: 34px; height: 26px; border-radius: 8px; background: rgba(111,78,55,0.10); color:#6F4E37; font-weight: 900; display:flex; align-items:center; justify-content:center; }
    .deliver-btn { border:none; background:#6F4E37; color:white; font-weight: 900; border-radius: 0.75rem; padding: 0.55rem 0.6rem; cursor:pointer; }

    .ready-empty, .served-empty { padding: 0.9rem 0.6rem; color:#6B5744; font-weight: 900; text-align:center; }
    .served-list { padding: 0.5rem; display:flex; flex-direction:column; }
    .served-row { display:flex; align-items:center; gap: 0.6rem; padding: 0.6rem 0.6rem; border-bottom: 1px solid rgba(111,78,55,0.06); }
    .served-row:last-child { border-bottom:none; }
    .served-table { width: 34px; height: 34px; border-radius: 10px; background: rgba(58,175,169,0.12); border: 1px solid rgba(58,175,169,0.25); color:#2A8F8A; font-weight: 900; display:flex; align-items:center; justify-content:center; }
    .served-id { font-weight: 900; color:#1A1208; font-size: 0.85rem; flex:1; }
    .served-tag { font-weight: 900; font-size: 0.72rem; color:#2A9D8F; background: rgba(42,157,143,0.14); padding: 0.2rem 0.5rem; border-radius: 999px; }
    .served-time { color:#9C8E84; font-weight: 900; font-size: 0.72rem; }

    /* Bill */
    .bill-top { display:flex; align-items:center; gap: 0.75rem; margin-bottom: 0.85rem; }
    .bill-back { width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid rgba(111,78,55,0.18); background: white; cursor: pointer; display:flex; align-items:center; justify-content:center; color:#6F4E37; }
    .bill-title { font-family:'Playfair Display',serif; font-weight: 900; font-size: 1.1rem; flex: 1; }
    .bill-chip { font-weight: 900; font-size: 0.75rem; color:#F4A261; background: rgba(244,162,97,0.14); border: 1px solid rgba(244,162,97,0.22); padding: 0.25rem 0.6rem; border-radius: 999px; }
    .bill-card { padding: 0.95rem; }
    .bill-brand { display:flex; flex-direction:column; gap: 0.8rem; }
    .bill-meta { margin-top: 0.4rem; display:flex; flex-direction:column; gap: 0.35rem; font-size: 0.8rem; color:#6B5744; font-weight: 800; }
    .bill-meta div { display:flex; justify-content:space-between; }
    .bill-meta span { color:#9C8E84; font-weight: 900; }

    .bill-items { margin-top: 0.85rem; background: #FAFAF7; border: 1px solid rgba(111,78,55,0.10); border-radius: 0.9rem; overflow: hidden; }
    .bill-items-head { display:grid; grid-template-columns: 1fr 54px 80px; gap: 0.5rem; padding: 0.6rem 0.75rem; font-size: 0.65rem; font-weight: 900; color:#9C8E84; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid rgba(111,78,55,0.08); }
    .bill-items-empty { padding: 0.9rem 0.75rem; color:#9C8E84; font-weight: 900; text-align:center; }
    .bill-item-row { display:grid; grid-template-columns: 1fr 54px 80px; gap: 0.5rem; padding: 0.6rem 0.75rem; border-bottom: 1px solid rgba(111,78,55,0.06); }
    .bill-item-row:last-child { border-bottom:none; }
    .bill-item-name { font-weight: 900; color:#1A1208; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bill-item-qty { text-align:center; font-weight: 900; color:#6B5744; }
    .bill-item-amt { text-align:right; font-weight: 900; color:#1A1208; }

    .bill-sum { margin-top: 0.85rem; }
    .sum-row { display:flex; justify-content:space-between; padding: 0.25rem 0; color:#6B5744; font-weight: 900; }
    .sum-row span { color:#9C8E84; font-weight: 900; }
    .sum-total { display:flex; justify-content:space-between; align-items:baseline; margin-top: 0.55rem; padding-top: 0.65rem; border-top: 1px solid rgba(111,78,55,0.10); }
    .sum-total span { font-weight: 900; color:#1A1208; }
    .sum-total b { font-family:'Playfair Display',serif; font-weight: 900; font-size: 1.6rem; color:#4A3423; }

    .pay-btn { width:100%; margin-top: 0.9rem; border:none; background:#6F4E37; color:white; font-weight: 900; padding: 0.85rem 1rem; border-radius: 1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap: 0.5rem; }

    /* Pay modal */
    .pay-overlay { position:absolute; inset:0; background: rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; padding: 1rem; z-index: 60; }
    .pay-card { width:100%; max-width: 380px; background:white; border-radius: 1.2rem; padding: 1rem; box-shadow: 0 24px 64px rgba(0,0,0,0.25); }
    .pay-head { display:flex; align-items:center; gap: 0.75rem; }
    .pay-close { margin-left:auto; width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid rgba(111,78,55,0.18); background: #FAFAF7; cursor:pointer; color:#6F4E37; display:flex; align-items:center; justify-content:center; }
    .pay-sub { margin-top: 0.25rem; color:#9C8E84; font-weight: 900; font-size: 0.8rem; text-align:center; }
    .qr-box { margin: 0.85rem auto 0.75rem; width: 240px; height: 240px; border-radius: 1rem; background: #FAFAF7; border: 1px solid rgba(111,78,55,0.14); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .pay-link { background: #F0EBE3; border-radius: 0.85rem; padding: 0.55rem 0.7rem; display:flex; align-items:center; gap: 0.45rem; color:#6B5744; font-weight: 900; font-size: 0.78rem; }
    .pay-confirm { width:100%; margin-top: 0.85rem; border:none; background:#3AAFA9; color:white; font-weight: 900; padding: 0.8rem 1rem; border-radius: 1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap: 0.5rem; }
    .pay-cash { width:100%; margin-top: 0.55rem; border:none; background:#EFEAE3; color:#6B5744; font-weight: 900; padding: 0.8rem 1rem; border-radius: 1rem; cursor:pointer; }

    /* Toasts */
    .toast-wrap { position:absolute; left: 0; right: 0; bottom: 14px; display:flex; flex-direction:column; gap: 0.5rem; align-items:center; pointer-events:none; z-index: 70; }
    .toast { pointer-events:none; background: rgba(26,18,8,0.92); color:white; padding: 0.7rem 0.85rem; border-radius: 0.95rem; box-shadow: 0 18px 36px rgba(0,0,0,0.24); display:flex; align-items:center; gap: 0.55rem; max-width: calc(100% - 24px); }
    .t-ic { font-weight: 900; }
    .t-msg { font-weight: 900; font-size: 0.82rem; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import WaiterApp from './components/WaiterApp.js';
    const { createApp } = Vue;
    createApp(WaiterApp).mount('#app');
  </script>
</body>
</html>
