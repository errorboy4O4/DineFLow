<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chef Station - DineFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    /* Design Tokens */
    :root {
      --coffee:    #6F4E37;
      --cream:     #F8F5F0;
      --mint:      #3AAFA9;
      --success:   #2A9D8F;
      --error:     #E63946;
      --dark-bg:   #1E1E1E;
      --white:     #FFFFFF;
      --border:    #EDE7DD;
      --muted:     #999;

      --cat-starter:   #F59E0B;
      --cat-main:      #E63946;
      --cat-breads:    #F4A261;
      --cat-sides:     #8B5CF6;
      --cat-desserts:  #EC4899;
      --cat-beverages: #3B82F6;
      --cat-custom:    #10B981;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: #1A1A1A;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Mobile shell centered on desktop (like customer) */
    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--cream);
      position: relative;
      box-shadow: 0 0 60px rgba(111,78,55,0.12);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--cream);
      color: var(--dark-bg);
      padding: 0.7rem 1rem;
      border-bottom: 2px solid var(--coffee);
    }
    .header-content { display:flex; justify-content:space-between; align-items:center; }
    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--coffee);
    }
    .header h1 i { color: var(--mint); }
    .header .time { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .queue-pill {
      background: var(--mint);
      border-radius: 2rem;
      padding: 0.15rem 0.75rem;
      text-align: center;
      min-width: 56px;
    }
    .q-label { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: rgba(255,255,255,0.8); text-transform: uppercase; }
    .q-count { font-family:'Poppins',sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--white); line-height: 1.1; }

    /* Container */
    .container {
      padding: 0.6rem;
      background: var(--cream);
      height: calc(100vh - 66px);
      height: calc(100dvh - 66px);
      display:flex;
      flex-direction:column;
      gap: 0.6rem;
    }

    .queue-title {
      font-family: 'Poppins', sans-serif;
      font-size: 12px; font-weight: 600;
      color: var(--coffee);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      display:flex;
      align-items:center;
      gap: 0.45rem;
    }
    .icon-btn {
      margin-left: auto;
      border: 1.5px solid rgba(111,78,55,0.22);
      background: rgba(255,255,255,0.7);
      color: var(--coffee);
      border-radius: 0.65rem;
      width: 34px;
      height: 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
    }

    /* Table wrapper */
    .table-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--white);
      border-radius: 0.75rem;
      box-shadow: 0 2px 16px rgba(111,78,55,0.12);
      border: 1.5px solid var(--border);
    }

    .orders-table { width:100%; display:flex; flex-direction:column; overflow:hidden; flex:1; }
    .orders-table table { width:100%; border-collapse:collapse; table-layout:fixed; }

    .orders-table thead { background: linear-gradient(135deg, #6F4E37 0%, #4A3020 100%); }
    .orders-table thead th {
      padding: 0.55rem 0.4rem;
      text-align: left;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
    }
    .orders-table thead th:first-child { width: 5px; padding: 0; border-radius: 0.75rem 0 0 0; }
    .orders-table thead th:nth-child(2) { width: 44px; text-align: center; }
    .orders-table thead th:nth-child(4) { width: 40px; text-align: center; }
    .orders-table thead th:last-child { width: 120px; text-align: center; border-radius: 0 0.75rem 0 0; }

    .orders-table tbody { display:block; overflow-y:auto; max-height: calc(100vh - 170px); }
    .orders-table thead, .orders-table tbody tr { display: table; width: 100%; table-layout: fixed; }

    .row { border-bottom: 1px solid var(--border); }
    .td { padding: 0.6rem 0.45rem; vertical-align: middle; }
    .strip { width:5px; padding:0; }
    .strip.starter { background: var(--cat-starter); }
    .strip.main { background: var(--cat-main); }
    .strip.breads { background: var(--cat-breads); }
    .strip.sides { background: var(--cat-sides); }
    .strip.desserts { background: var(--cat-desserts); }
    .strip.beverages { background: var(--cat-beverages); }
    .strip.custom { background: var(--cat-custom); }

    .table-cell { text-align:center; font-weight:800; color:#3B2A1E; }
    .table-num { font-family:'Poppins',sans-serif; font-size: 16px; }

    .dish-cell { overflow: hidden; }
    .dish-name { font-weight: 900; color: #1A1208; font-size: 13px; line-height: 1.15; display:flex; gap:0.4rem; align-items:center; min-width:0; }
    .dish-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dish-cat { color:#9C8E84; font-weight:800; font-size:11px; margin-top: 0.2rem; }

    .custom-badge {
      font-size: 9px;
      font-weight: 900;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      background: rgba(16,185,129,0.16);
      color: #0F766E;
      letter-spacing: 0.08em;
    }

    .qty-cell { text-align:center; }
    .qty-pill {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(111,78,55,0.12);
      color: var(--coffee);
      font-weight: 900;
      font-family:'Poppins',sans-serif;
      font-size: 12px;
    }

    .actions-cell { text-align:center; }
    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .btn-done {
      border: none;
      background: var(--mint);
      color: white;
      font-weight: 900;
      padding: 0.44rem 0.45rem;
      border-radius: 0.65rem;
      cursor: pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 0.4rem;
      flex: 1;
      width: auto;
      min-width: 0;
      font-size: 10.5px;
      white-space: nowrap;
      line-height: 1;
    }
    .btn-done:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-note {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1.5px solid rgba(111,78,55,0.26);
      background: rgba(248,245,240,0.92);
      color: var(--coffee);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-note:active { transform: scale(0.98); }
    .btn-note i { font-size: 11px; }

    .note-box {
      margin-top: 0.6rem;
      background: #FAFAF7;
      border: 1px solid rgba(111,78,55,0.14);
      border-radius: 0.85rem;
      padding: 0.75rem 0.85rem;
      color: #6B5744;
      font-weight: 800;
      font-size: 12px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .btn-recipe {
      border: 1.5px solid rgba(111,78,55,0.35);
      background: rgba(248,245,240,0.9);
      color: var(--coffee);
      font-weight: 900;
      padding: 0.48rem 0.55rem;
      border-radius: 0.7rem;
      cursor: pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 0.4rem;
      width: 100%;
      min-width: 0;
      font-size: 11px;
      margin-bottom: 0.45rem;
    }

    /* Toast */
    .toast {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      background: rgba(30,30,30,0.92);
      color: white;
      padding: 0.7rem 0.85rem;
      border-radius: 0.9rem;
      display:flex;
      align-items:center;
      gap: 0.55rem;
      box-shadow: 0 18px 36px rgba(0,0,0,0.24);
      transition: opacity 0.25s, transform 0.25s;
      opacity: 1;
      max-width: calc(100% - 24px);
    }
    .toast.hide { opacity: 0; transform: translateX(-50%) translateY(10px); }
    .t-msg { font-weight: 900; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 1rem;
      z-index: 60;
    }
    .modal-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      border: 1px solid rgba(111,78,55,0.2);
    }
    .modal-head {
      background: linear-gradient(135deg, #6F4E37 0%, #4A3020 100%);
      color: white;
      padding: 0.85rem 0.9rem;
      display:flex;
      align-items:center;
      gap: 0.7rem;
    }
    .modal-icon {
      width: 40px;
      height: 40px;
      border-radius: 0.9rem;
      background: rgba(255,255,255,0.14);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .modal-title { font-family:'Poppins',sans-serif; font-size: 16px; font-weight: 800; margin: 0; }
    .modal-sub { font-size: 11px; opacity: 0.9; margin-top: 2px; font-weight: 700; }
    .close-btn {
      margin-left: auto;
      border: none;
      background: rgba(255,255,255,0.12);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 0.75rem;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .modal-body { padding: 0.9rem 0.95rem 1.05rem; max-height: 68vh; overflow:auto; }
    .m-title { font-weight: 900; color: #4A3423; font-size: 12px; display:flex; align-items:center; gap: 0.45rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .ing-list { margin-top: 0.6rem; display:flex; flex-direction:column; gap: 0.5rem; }
    .ing-item { display:flex; align-items:center; gap: 0.55rem; }
    .ing-dot { width: 10px; height: 10px; border-radius: 999px; background: rgba(58,175,169,0.22); border: 2px solid rgba(58,175,169,0.55); }
    .ing-name { flex:1; font-weight: 900; color: #1A1208; font-size: 12px; }
    .ing-amt { font-weight: 900; color: #6B5744; font-size: 12px; }
    .ing-empty, .step-empty { margin-top: 0.5rem; color:#9C8E84; font-weight: 900; font-size: 12px; }
    .steps-list { margin-top: 0.6rem; display:flex; flex-direction:column; gap: 0.65rem; }
    .step { display:flex; gap: 0.6rem; }
    .step-num { width: 24px; height: 24px; border-radius: 999px; background: rgba(111,78,55,0.12); color: var(--coffee); display:flex; align-items:center; justify-content:center; font-weight: 900; font-family:'Poppins',sans-serif; font-size: 12px; flex-shrink:0; }
    .step-text { font-weight: 800; color: #6B5744; font-size: 12px; line-height: 1.35; }
  </style>
</head>
<body>
  <div id="app">
    <chef-station></chef-station>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script type="module">
    import ChefStation from './components/ChefStation.js';
    const { createApp } = Vue;
    createApp({ components: { ChefStation } }).mount('#app');
  </script>
</body>
</html>
